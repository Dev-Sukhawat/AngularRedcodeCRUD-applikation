<div class="card border-1 shadow-sm rounded-4 p-4 quote-card group transition-all position-relative">
    @if (quote().title) {
    <div class="mb-2">
        <small class="text-muted text-uppercase tracking-wider" style="font-size: 11px;">
            <i class="fa-solid fa-book text-primary opacity-50 me-1"></i> Title: {{ quote().title }}
        </small>
    </div>
    }
    <div class="d-flex align-items-center">
        <p class="mb-0 flex-grow-1 pe-5 lead-sm quote-text d-flex align-items-center">
            <span class="text-primary fw-bold me-1">“</span>
            {{ quote().text }}
            <span class="text-primary fw-bold ms-1">”</span>
        </p>

        <div class="d-flex gap-1">
            <button (click)="edit.emit()" class="btn action-buttons btn-link text-muted rounded-1 hover-bg-light"
                aria-label="Edit">
                <i class="far fa-edit" style="font-size: 14px;"></i>
            </button>

            <button (click)="delete.emit()" class="btn action-buttons btn-link text-muted rounded-1 hover-bg-light-danger"
                aria-label="Delete">
                <i class="far fa-trash-alt" style="font-size: 14px;"></i>
            </button>
            </div>
    </div>
    @if (quote().pageNumber) {
    <div class="mt-3 pt-2 border-top border-light-subtle">
        <small class="text-muted text-uppercase tracking-wider" style="font-size: 11px;">
            <i class="fas fa-bookmark text-primary opacity-50 me-1"></i> Page {{ quote().pageNumber }}
        </small>
    </div>
    }
</div>
