<div class="modal-backdrop-custom d-flex align-items-center justify-content-center p-3"
    (click)="$event.target === $event.currentTarget && close.emit()">
    <div class="card border-0 shadow-lg rounded-4 w-100" style="max-width: 450px;" (click)="$event.stopPropagation()">

        <div class="card-body p-4">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <h2 class="h5 fw-semibold mb-0">Edit Quote</h2>
                <button (click)="close.emit()" class="btn btn-link text-muted p-1 rounded-3 hover-bg-light">
                    <i class="fas fa-times" style="font-size: 16px;"></i>
                </button>
            </div>

            <form [formGroup]="editForm" (ngSubmit)="submit()">

                <div class="mb-3">
                    <label class="form-label small fw-medium text-muted mb-2">Title (Optional)</label>
                    <input type="text" formControlName="title" class="form-control auth-input text-muted"
                        placeholder="Ex. Book title or chapter">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-medium text-muted mb-2">Page Number (Optional)</label>
                    <input type="number" formControlName="pageNumber" class="form-control auth-input text-muted"
                        placeholder="Ex. 42">
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-medium text-muted mb-2">Quote Text</label>
                    <textarea formControlName="text" class="form-control auth-input text-muted py-2" rows="4"
                        placeholder="Skriv citatet här...">
                    </textarea>

                    @if (editForm.get('text')?.touched && editForm.get('text')?.invalid) {
                    <div class="text-danger small mt-1" style="font-size: 12px;">
                        Quote text is required and must be between 2 and 500 characters.
                    </div>
                    }
                </div>

                <div class="d-flex gap-2">
                    <button type="button" (click)="close.emit()"
                        class="btn btn-outline-secondary flex-grow-1 py-2 rounded-3 border-1 text-dark fw-medium bg-white">
                        Cancel
                    </button>

                    <button type="button" (click)="submit()"
                        class="btn btn-primary flex-grow-1 py-2 rounded-3 fw-medium d-flex align-items-center justify-content-center gap-2">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>
