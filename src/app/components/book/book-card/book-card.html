<div class="card h-100 border-1 shadow-sm rounded-4 p-3 book-card group transition-all">
    <div class="d-flex align-items-start justify-content-between gap-3">
        <div class="text-truncate">
            <h3 class="h6 fw-semibold mb-1 text-truncate">{{ book().title }}</h3>
            <p class="small text-muted mb-0 text-truncate">{{ book().author }}</p>
        </div>

        <div class="d-flex align-items-center gap-1 action-buttons transition-opacity">
            <button (click)="edit.emit()" class="btn btn-link text-muted p-1 rounded-3 hover-bg-light"
                aria-label="Edit">
                <i class="fas fa-pencil-alt" style="font-size: 14px;"></i>
            </button>
            <button (click)="delete.emit()" class="btn btn-link text-muted p-1 rounded-3 hover-bg-light-danger"
                aria-label="Delete">
                <i class="far fa-trash-alt" style="font-size: 14px;"></i>
            </button>
        </div>
    </div>
</div>
