<section class="container max-w-6xl pt-5 mt-5 pb-5">
    <div class="row">
        <div class="col-lg-8">
            <!-- Badge -->
            <span class="badge-custom">
                <span class="dot"></span> Soft, minimal CRUD
            </span>

            <!-- Hero Title -->
            <h1 class="hero-title mt-4">
                Your library, <br />
                <span class="text-muted">beautifully simple.</span>
            </h1>

            <!-- Description -->
            <p class="hero-desc mt-4">
                Keep books and quotes in one calm place. No clutter, no friction — just

            </p>

            <!-- Buttons -->
            <div class="d-flex flex-wrap gap-3 mt-5">
                <a routerLink="/register" class="btn btn-primary-custom">

                desc="A tidy collection of titles you've read or want to read — add, edit, delete in a click.">
            </app-feature-card>
        </div>

        <div class="col-md-6">
            <app-feature-card icon="fa-solid fa-quote-left" title="Quotes"
                desc="Capture lines that stay with you. Hover any quote to remove it instantly.">
