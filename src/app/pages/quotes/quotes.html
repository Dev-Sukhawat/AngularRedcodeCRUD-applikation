<app-navbar></app-navbar>
<div class="container py-5" style="max-width: 800px;">
    <header class="mb-4">
        <p class="text-uppercase text-muted small tracking-wider mb-1">Inspiration</p>
        <h1 class="display-6 fw-bold">Quotes</h1>
    </header>

    <div class="card p-3 mb-5">
        <form [formGroup]="quoteForm" (ngSubmit)="add()">
            <div class="d-flex justify-content-center">
                <input type="text" id="quoteTitle" formControlName="title"
                    class="form-control border-0 shadow-none bg-transparent text-body p-2 text-center fs-5 fw-bold border-bottom border-primary-subtle"
                    style="color: var(--muted-foreground) !important;" placeholder="Give it a title…" />
            </div>
                <textarea formControlName="text" rows="3"
                    class="form-control border-0 shadow-none bg-transparent text-body resize-none p-2"
                    style="color: var(--muted-foreground) !important;" placeholder="Capture a line worth remembering…"></textarea>
            <div class="d-flex justify-content-between align-items-center pt-3 mt-2">
                <div class="d-flex align-items-center gap-2" style="max-width: 150px;">
                    <span class="text-muted small">Page:</span>
                    <input type="number" formControlName="pageNumber"
                        class="form-control form-control-sm rounded-3 shadow-none text-center" placeholder="e.g. 42" min="1" />
                </div>

                <button type="submit" [disabled]="quoteForm.invalid || adding()"
                    class="btn btn-primary rounded-3 px-4 d-flex align-items-center gap-2">
                    @if (adding()) { <span class="spinner-border spinner-border-sm"></span> }
                    @else { <i class="fas fa-plus"></i> }
                    Add quote
            </button>
            </div>
        </form>
    </div>

    @if (loading()) {
    <div class="text-center py-5">
        <div class="spinner-border text-primary"></div>
    </div>
    } @else if (quotes().length === 0) {
    <div class="text-center py-5 rounded-4 empty-state-box">
        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-3">
            <i class="fas fa-quote-left" style="font-size: 24px;"></i>
        </div>
        <p class="text-muted mb-0">No quotes yet.</p>
    </div>
    } @else {
        <div class="d-flex flex-column gap-3">
            @for (q of quotes(); track q.id) {
            <app-quote-card [quote]="q" (delete)="remove(q.id!)" (edit)="openEdit(q)"> </app-quote-card>
            }
            </div>
        @if (isDialogOpen()) {
        <app-quote-dialog [quote]="selectedQuote()" (close)="isDialogOpen.set(false)"
            (saved)="update(selectedQuote()!.id!, $event)"> </app-quote-dialog>
        }
    }
</div>
