<app-navbar></app-navbar>
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card shadow-sm border-2 p-4"
        style="max-width: 400px; width: 100%; border-radius: var(--radius); background-color: var(--card);">

        <div class="card-body">
            <h1 class="h4 fw-bold mb-1" style="color: var(--foreground);">Create an account</h1>
            <p class="small mb-4" style="color: var(--muted-foreground);">Join us to start building your personal
                library.</p>

            <form (submit)="onSubmit()">
                <div class="mb-3">
                    <label class="form-label small fw-medium" style="color: var(--muted-foreground);">Full Name</label>
                    <input type="text" name="name" [(ngModel)]="name" autocomplete="name"
                        class="form-control form-control-lg fs-6" placeholder="John Doe" required
                        style="background-color: transparent; border-color: var(--border); color: var(--foreground);">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-medium" style="color: var(--muted-foreground);">Email</label>
                    <input type="email" name="email" [(ngModel)]="email" autocomplete="email"
                        class="form-control form-control-lg fs-6" placeholder="you@example.com" required
                        style="background-color: transparent; border-color: var(--border); color: var(--foreground);">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-medium" style="color: var(--muted-foreground);">Password</label>
                    <input type="password" name="password" [(ngModel)]="password" autocomplete="new-password"
                        class="form-control form-control-lg fs-6" placeholder="••••••••" required
                        style="background-color: transparent; border-color: var(--border); color: var(--foreground);">
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" [disabled]="loading()" class="btn btn-primary btn-lg fs-6 fw-medium py-2">
                        @if (loading()) {
                        <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                        }
                        Create account
                    </button>
                </div>
            </form>

            <div class="d-flex align-items-center my-4">
                <hr class="flex-grow-1" style="color: var(--border);">
                <span class="px-3 small text-uppercase"
                    style="color: var(--muted-foreground); font-size: 0.7rem;">or</span>
                <hr class="flex-grow-1" style="color: var(--border);">
            </div>

            <div class="d-grid">
                <button (click)="onGoogleSignIn()"
                    class="btn btn-outline-secondary d-flex align-items-center justify-content-center py-2"
                    style="border-color: var(--border); color: var(--foreground);">
                    <svg class="me-2" width="18" height="18" viewBox="0 0 48 48">
                        <path fill="#FFC107"
                            d="M43.6 20.5H42V20H24v8h11.3C33.7 32.5 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z" />
                        <path fill="#FF3D00"
                            d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
                        <path fill="#4CAF50"
                            d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35 26.7 36 24 36c-5.3 0-9.7-3.5-11.3-8.3l-6.5 5C9.5 39.6 16.2 44 24 44z" />
                        <path fill="#1976D2"
                            d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C41 35.5 44 30.2 44 24c0-1.2-.1-2.3-.4-3.5z" />
                    </svg>
                    Sign up with Google
                </button>
            </div>

            <p class="mt-4 text-center small" style="color: var(--muted-foreground);">
                Already have an account? <a routerLink="/login" class="text-decoration-none fw-semibold"
                    style="color: var(--primary);">Sign in</a>
            </p>
        </div>

    </div>
</div>
